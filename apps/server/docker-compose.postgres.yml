services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-ai-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - personal_ai_assistant_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    container_name: personal-ai-assistant-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_ai_assistant_test
    ports:
      - "5433:5432"

volumes:
  personal_ai_assistant_postgres:
